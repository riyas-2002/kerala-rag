services:
  - type: web
    name: kerala-rag-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: TOP_K_CHUNKS
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.35"
      - key: MAX_CONTEXT_TOKENS
        value: "2000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
